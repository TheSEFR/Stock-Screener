name: Stock Screener - Informe mensual/anual

# Dia 1 de cada mes, 08:00 UTC (~09:00-10:00 Madrid segun DST). El propio
# script (monthly_report.py) detecta ademas si es 1 de enero para generar
# tambien el informe anual en la misma ejecucion.
on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python monthly_report.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar historico de precios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          git diff --staged --quiet || git commit -m "chore: actualizar price_history.json"
          git push
