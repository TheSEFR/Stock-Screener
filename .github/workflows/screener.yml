name: Stock Screener

on:
  schedule:
    # Horas en UTC. Corresponden a 08:00 / 14:00 / 21:00 hora de Madrid (CEST, UTC+2).
    # Nota: en horario de invierno (CET, UTC+1) llegaran 1h mas tarde de lo esperado.
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python screener.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcionales (ver README): si no se configuran, el informe funciona
          # igual que antes, sin el respaldo de estas fuentes adicionales.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
